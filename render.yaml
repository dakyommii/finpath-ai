services:
  - type: web
    name: finpath-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      # Render의 관리형 Postgres는 무료 플랜도 카드 인증을 요구해서 대신 Neon(카드 불필요)을
      # 쓴다. Neon 프로젝트 생성 후 연결 문자열을 Render 대시보드에서 이 값으로 직접 입력한다.
      - key: DATABASE_URL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_API_BASE
        value: https://api.openai.com/v1
      - key: EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: ENV
        value: production
